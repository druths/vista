server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # .webmanifest isn't in nginx's default MIME table, and Chrome ignores a
    # manifest served as the wrong type.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The worker and the shell must not be cached, or an update never lands.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
